</head>

  <div class="bungkus">
    <h1><a href="/" title="McLung ChessBase"><img class="logo" src="/static/img/logo.png" alt="McLung ChessBase"></a></h1>
  </div>
  <nav class="nav-utama" aria-label="Navigasi utama"><div class="bungkus">

    <span class="pemisah" aria-hidden="true"></span>

  </div></nav>

<main>
  <div id="galat" class="galat" hidden></div>

  <div class="papan-tata">

    <div>
      <div class="papan-baris">
        <div class="eval-bar" id="eval-bar" title="Evaluasi engine, sudut pandang Putih">
          <div class="eval-bar-putih" id="eval-bar-isi" style="height:50%"></div>
          <span class="eval-bar-angka bawah" id="eval-angka">—</span>
        </div>
        <div id="papan"></div>
      </div>

      <div class="alat">
        <div class="segmen" role="radiogroup" aria-label="Mode papan">
          <input type="radio" name="mode" id="mode-main" value="main" checked>
          <label for="mode-main" title="Hanya langkah sah">Main</label>
          <input type="radio" name="mode" id="mode-susun" value="susun">
          <label for="mode-susun" title="Taruh dan buang bidak bebas; seret dari cadangan, seret keluar papan untuk membuang">Susun</label>
        </div>
        <span class="status-posisi" id="status-posisi"></span>
        <div class="ikon-tombol">
          <button id="undo"      title="Batalkan langkah (←)">↶</button>
          <button id="awal"      title="Posisi awal">⟲</button>
          <button id="kosongkan" title="Kosongkan papan">✕</button>
          <button id="balik"     title="Balik papan (F)">⇅</button>
          <button id="simpan-posisi" class="tombol-simpan" data-asal="analisis"
                title="Simpan posisi ini supaya bisa dibuka lagi dari tab Tersimpan" hidden>☆ Simpan</button>
        </div>
      </div>

      <div class="alat susun" id="kotak-susun" hidden>
        <label>Giliran
          <select id="giliran">
            <option value="w">Putih</option>
            <option value="b">Hitam</option>
          </select>
        </label>
        <span class="pisah"></span>
        <span class="label-mini" title="Hak rokade yang masih ada">Rokade</span>
        <label class="centang"><input type="checkbox" id="rokade-K" checked> K</label>
        <label class="centang"><input type="checkbox" id="rokade-Q" checked> Q</label>
        <label class="centang"><input type="checkbox" id="rokade-k" checked> k</label>
        <label class="centang"><input type="checkbox" id="rokade-q" checked> q</label>
      </div>

      <div class="fen-baris">
        <input id="fen" type="text" spellcheck="false" aria-label="FEN" placeholder="FEN" title="Tempel FEN lalu Enter">
        <button id="terapkan" title="Terapkan FEN (Enter)">Terapkan</button>
        <button id="salin" title="Salin FEN">Salin</button>
      </div>
    </div>

    <div>
      <div class="kartu">
        <div class="engine-kepala">
          <div>
            <div class="engine-skor" id="engine-skor" title="Sudut pandang Putih">—</div>
            <div class="engine-meta" id="engine-meta">Stockfish</div>
          </div>
          <button id="analisa" class="utama" title="Evaluasi posisi (spasi)">Analisa</button>
          <button id="terus" title="Analisis tanpa henti: engine berpikir makin dalam sampai dihentikan, posisi berubah, depth 30, atau 2 menit">Terus</button>
        </div>
        <div class="engine-atur">
          <label title="Laptop = Stockfish penuh di server. Perangkat ini = Stockfish WASM di browser (pakai prosesor HP/tablet ini, tidak antre dengan batch di laptop; lebih lemah, tanpa Terus)">Engine
            <select id="engine">
              <option value="server" selected>laptop</option>
              <option value="browser">perangkat ini</option>
            </select>
          </label>
          <label class="centang" title="Evaluasi ulang setiap posisi berubah"><input type="checkbox" id="otomatis" checked> Otomatis</label>
          <label>Garis
            <select id="multipv">
              <option value="1">1</option>
              <option value="3" selected>3</option>
              <option value="5">5</option>
            </select>
          </label>
          <label>Depth
            <select id="depth" title="auto = mengikuti profil RAM server">
              <option value="">auto</option>
              <option value="12">12</option>
              <option value="16">16</option>
              <option value="20">20</option>
              <option value="24">24</option>
            </select>
          </label>
        </div>
        <div class="engine-status" id="status-engine"></div>
      </div>

      <div class="kartu" style="margin-top:16px">
        <div id="garis" title="Klik langkah untuk memainkannya"><div class="pesan kecil">—</div></div>
      </div>
    </div>

  </div>
</main>

<script src="/static/vendor/jquery.min.js"></script>

</body>
</html>
